# OpenSpec 项目配置
# 作用：给 propose / apply / explore 提供固定上下文与各产物的写作规则，
#      不必每次在对话里重复解释项目约束。

context: |
  产品：iPad 小学生英语学习 App「跟着课本学英语」，个人自用，**不上架 App Store**。
  用户：一名二年级孩子（6-8 岁）+ 家长（妈妈/爸爸共用一组 PIN）。

  技术栈：SwiftUI + SwiftData，iOS 18+，SPM，ZIPFoundation（解包学期包）。
  部署：家里的 Mac + Xcode 无线调试，免费 Apple ID（签名 7 天，需定期重签）；
        bundle id 一旦确定不可更改。不做 iCloud、不做服务器。

  内容分发：App 内零课程内容，只内置几 KB 的 catalog.json；
            学期包经文园局域网 HTTP 服务（家里电脑跑 Node）按需下载，
            下载后完全离线可学。内容为沪教版二年级上：6 单元 / 33 词 / 18 句型 / 129 条课文原声。

  关键约束：
  - 内容只读、常驻内存，不进 SwiftData；进度用业务码 String（如 w:758201、s:u1-s1）关联。
  - 学习状态全部本地存储，卸载即丢失，需明示用户。
  - 正确率口径默认只统计「说」环节（AccuracyRule.countedKinds），存明细（Attempt）而非聚合。
  - 每日 20 分钟预算、每日发星上限、星星余额上限 500 属防沉迷底线，不开放给家长调整。
  - 儿童隐私：录音只在本机处理、不上传；不接第三方语音评测。

rules:
  proposal:
    - 说明"不做什么"（Non-Goals），避免范围蔓延。
    - 涉及内容规模变化时，同时给出体积与下载方式的影响。
  specs:
    - 每个 Scenario 必须可判定（可手工验证或自动化），避免"评估准确度"这类无法验收的措辞。
    - 明确列出边界与降级路径（离线、无权限、内容缺失、版本不兼容）。
  design:
    - 每个决策写"备选方案 + 为什么不用"，不要只写结论。
    - 数值参数集中成一张表，并标明「已定 / 待确认」。
    - 涉及模型变更时，同步说明对 Schema 类型数量与数据迁移的影响。
  tasks:
    - 每条任务写清验收方式（能编译 / 能真机验证 / 手工检查清单）。
    - 需要外部条件（真机、Mac、家里电脑服务、内容素材）的任务要标注前置依赖。
